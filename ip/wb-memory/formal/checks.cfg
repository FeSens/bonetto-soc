# Documentation of what the wb_memory.sby file checks.
#
# `prove` task — BMC + k-induction. Asserts wb_memory's Wishbone outputs
# obey B4-pipelined protocol under any symbolic input stream. Specifically:
#   - ack pulses only after a stb in the same cyc.
#   - ack is 0 outside an active cyc.
#   - stall is 0 (wb_memory never stalls).
#   - err is 0 (wb_memory never errors).
#   - outstanding requests count never overflows.
# All depth 20.
#
# `cover` task — proves the slave can actually retire reads and writes
# (prevents vacuous pass: a no-op slave would also satisfy the assertion
# set).
#
# Both run on smtbmc + bitwuzla. Switch solver in the .sby file if a
# specific bug needs a different one.
